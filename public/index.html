            ? 'You both did equally well!'
            : (me.crossed !== them.crossed
                ? 'Making it across beats falling through.'
                : (Math.abs(me.progress - them.progress) > 1e-4
                    ? 'Got further up the paper.'
                    : 'Same distance, but faster.'))}</p>
      ${net.role === 'host'
        ? `<button id="btn-primary">New sheet</button>`
        : `<p class="waiting">Waiting for the host…</p>`}
      <button id="btn-secondary" class="ghost">Main Menu</button>`;

  } else if (kind === 'roundready') {
    const who = game.round === 1 ? ['Player 1', 'Player 2'] : ['Player 2', 'Player 1'];
    html = `
      <h2 id="card-title">Round ${game.round} of 2</h2>
      <p class="tight"><strong>${who[0]}</strong> drags the pencil.</p>
      <p><strong>${who[1]}</strong> holds the paper. Tap the SHAKE strips
         on the sides to shake the paper and make the other player fall!</p>
      <div class="rule"></div>
      <p class="stat">${T.SHAKE_CHARGES} shakes in hand · one back every
         ${(T.SHAKE_RECHARGE_MS / 1000).toFixed(0)}s</p>
      <p>${game.round === 1
            ? 'Player 2 goes next on the same paper — same holes, fair match.'
            : 'Same paper that Player 1 just played.'}</p>
      <button id="btn-primary">Begin round ${game.round}</button>
      <button id="btn-secondary" class="ghost">Main Menu</button>
      <p class="hint">Paper holder: tap the side strips, or press Z / M keys.</p>`;
  // roundover / duelover are the shared-device duel only. Two phones is a
  // race now, and reports through 'raceover'.
  } else if (kind === 'roundover') {
    const r = game.results[0];
    html = `
      <h2 id="card-title">${r.crossed ? 'Made it across!' : 'Fell through!'}</h2>
      <p class="tight">Player 1, on the pencil.</p>
      <p class="stat">${Math.round(r.progress * 100)}% done &nbsp;·&nbsp; ${fmt(r.time)}s</p>
      <p>Switch! Player 2 plays the same paper now.</p>
      <button id="btn-primary">Round 2</button>
      <button id="btn-secondary" class="ghost">Main Menu</button>`;

  } else if (kind === 'duelover') {
    const [a, b] = game.results;
    const win = judgeDuel(a, b);
    const line = (n, r) => `<p class="stat">Player ${n} &nbsp;·&nbsp; ${
      r.crossed ? 'made it' : Math.round(r.progress * 100) + '% done'
    } &nbsp;·&nbsp; ${fmt(r.time)}s</p>`;
    html = `
      <h2 id="card-title">${win === 0 ? 'It\'s a tie!' : 'Player ' + win + ' wins!'}</h2>
      ${line(1, a)}${line(2, b)}
      <div class="rule"></div>
      <p>${win === 0
            ? 'Both players did equally well!'
            : (a.crossed !== b.crossed
                ? 'Making it across beats falling through.'
                : (Math.abs(a.progress - b.progress) > 1e-4
                    ? 'Got further up the paper.'
                    : 'Same distance, but faster.'))}</p>
      <button id="btn-primary">New sheet</button>
      <button id="btn-secondary" class="ghost">Main Menu</button>`;

  } else if (kind === 'fell') {
    html = `
      <h2 id="card-title">You fell through!</h2>
      <p class="tight">Level ${game.level} of ${T.LEVELS}.</p>
      <p class="stat">${pct}% done &nbsp;·&nbsp; ${fmt(game.elapsed)}s</p>
      <button id="btn-primary">Try again</button>
      <button id="btn-secondary" class="ghost">Main Menu</button>`;
  } else if (kind === 'cleared') {
    const earnedStars = game.earnedStars || 1;
    const isNewBest = game.isNewBest || false;
    html = `
      <h2 id="card-title">Level complete!</h2>
      <p class="tight">Level ${game.level} of ${T.LEVELS} done.</p>
      <div class="stars-display">${starsHtml(earnedStars)}</div>
      <p class="stat">${fmt(game.elapsed)}s${isNewBest ? ' · <span class="new-best">🏆 New Best!</span>' : ''}</p>
      <p id="rank-badge-text" class="rank-badge">${game.globalRank ? '🌍 Rank #' + game.globalRank + ' worldwide!' : ''}</p>
      <p>Next level has more holes, packed tighter!</p>
      <button id="btn-primary">Next level</button>
      <button id="btn-secondary" class="ghost">Main Menu</button>`;
  } else if (kind === 'won') {
    let totalStars = 0;
    for (let i = 1; i <= T.LEVELS; i++) {
      const l = stats.sp.levels[String(i)];
      if (l) totalStars += l.stars;
    }
    html = `
      <h2 id="card-title">You beat all<br>12 levels!</h2>
      <p>You made it through every level without falling. Amazing job!</p>
      <p class="stat">⭐ ${totalStars} / ${T.LEVELS * 3}</p>
      <button id="btn-primary">Play again</button>
      <button id="btn-secondary" class="ghost">Main Menu</button>
      <button id="btn-stats" class="ghost">📊 Scoreboard</button>`;
  } else if (kind === 'stats') {
    html = `
      <h2 id="card-title">📊 Scoreboard</h2>
      <div class="tabs">
        <button class="tab active" data-tab="sp">🎯 Single</button>
        <button class="tab" data-tab="dp">📱 2P Local</button>
        <button class="tab" data-tab="net">🌐 Online</button>
        <button class="tab" data-tab="global">🏆 Global</button>
      </div>
      <div id="stats-body">${buildStatsTab('sp')}</div>
      <div class="rule"></div>
      <button id="btn-reset" class="ghost" style="font-size:12px;padding:10px">🔄 Reset All Stats</button>
      <button id="btn-secondary" class="ghost">← Back</button>`;
  } else if (kind === 'skins') {
    const totalStars = getTotalStars();
    const equipped = getEquippedSkin();
    let skinListHtml = '';
    SKINS.forEach(s => {
      const isUnlocked = totalStars >= s.stars;
      const isEquipped = equipped.id === s.id;
      skinListHtml += `
        <div class="skin-card${isEquipped ? ' active' : ''}${!isUnlocked ? ' locked' : ''}">
          <div class="skin-icon">${s.badge}</div>
          <div class="skin-info">
            <div class="skin-name">${esc(s.name)}</div>
            <div class="skin-req">${s.stars === 0 ? 'Default' : '⭐ Requires ' + s.stars + ' stars'}</div>
          </div>
          ${isEquipped ? '<span class="skin-badge">EQUIPPED</span>' : (isUnlocked ? `<button class="skin-equip-btn" data-skin="${s.id}">EQUIP</button>` : '🔒')}
        </div>`;
    });

    html = `
      <h2 id="card-title">🎨 Pencil Skins</h2>
      <p class="stat">⭐ ${totalStars} / ${T.LEVELS * 3} Total Stars Earned</p>
      <div class="skins-grid">${skinListHtml}</div>
      <div class="rule"></div>
      <button id="btn-secondary" class="ghost">← Back</button>`;
  }

  card.innerHTML = html;

  const primary = card.querySelector('#btn-primary');
  const secondary = card.querySelector('#btn-secondary');
  const third = card.querySelector('#btn-third');

  // The guest's lobby and result cards have no primary button at all — the
  // host drives every transition, so there is no readiness handshake.
  if (primary) primary.onclick = () => {
    soundClick();
    if (kind === 'title' || kind === 'won') startRun();
    else if (kind === 'fell') loadSheet();
    else if (kind === 'cleared') { game.level++; loadSheet(); }
    // Two players, one device. The sheet is never regenerated between rounds.
    else if (kind === 'roundready') startRound();
    else if (kind === 'roundover') { game.round = 2; showScreen('roundready'); }
    else if (kind === 'duelover') startDuel();
    // Two phones — a race.
    else if (kind === 'netmenu') netConnect(() => netAsk({ t: 'create' }));
    else if (kind === 'joining') submitCode();
    else if (kind === 'netfail') leaveOnline();
    else if (kind === 'lobby') beginRace();
    else if (kind === 'raceover') netAsk({ t: 'reseed' });   // server issues the seed
  };

  if (secondary) {
    secondary.onclick = () => {
      soundClick();
      if (kind === 'title') return startDuel();
      if (kind === 'stats') return showScreen('title');
      if (kind === 'netmenu') return showScreen('joining');
      if (kind === 'joining' || kind === 'hosting') { closeSocket(); return showScreen('netmenu'); }
      leaveOnline();
    };
  }

  if (third) {
    third.onclick = () => {
      soundClick();
      if (kind === 'title') { if (canGoOnline) showScreen('netmenu'); }
      else if (kind === 'netmenu') leaveOnline();
    };
  }

  // Stats & scoreboard button
  const statsBtn = card.querySelector('#btn-stats');
  if (statsBtn) statsBtn.onclick = () => { soundClick(); showScreen('stats'); };

  // Pencil skins button
  const skinsBtn = card.querySelector('#btn-skins');
  if (skinsBtn) skinsBtn.onclick = () => { soundClick(); showScreen('skins'); };

  // Skins screen equip handlers
  if (kind === 'skins') {
    card.querySelectorAll('.skin-equip-btn').forEach(btn => {
      btn.onclick = () => {
        soundClick();
        equipSkin(btn.dataset.skin);
        showScreen('skins');
      };
    });
  }

  // Stats screen: tab switching & reset
  if (kind === 'stats') {
    card.querySelectorAll('.tab').forEach(btn => {
      btn.onclick = () => {
        soundClick();
        card.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        if (btn.dataset.tab === 'global') {
          fetchLeaderboard();
        } else {
          document.getElementById('stats-body').innerHTML = buildStatsTab(btn.dataset.tab);
        }
      };
    });
    const resetBtn = card.querySelector('#btn-reset');
    if (resetBtn) resetBtn.onclick = () => {
      soundClick();
      if (confirm('Reset all stats? This cannot be undone.')) {
        resetStats();
        showScreen('stats');
      }
    };
  }

  // Kept live so the name survives moving between the menu and the code entry.
  const globalNameIn = card.querySelector('#global-name-in');
  if (globalNameIn) {
    globalNameIn.addEventListener('input', () => {
      const val = globalNameIn.value;
      setPlayerName(val);
      net.myName = cleanName(val);
    });
  }

  const nameIn = card.querySelector('#name-in');
  if (nameIn) {
    nameIn.addEventListener('input', () => {
      const val = nameIn.value;
      net.myName = cleanName(val);
      setPlayerName(val);
    });
  }

  const codeIn = card.querySelector('#code-in');
  if (codeIn) {
    codeIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCode(); });
    codeIn.focus({ preventScroll: true });
  } else if (primary) {
    primary.focus({ preventScroll: true });
  }
}

function submitCode() {
  const el = card.querySelector('#code-in');
  const code = (el ? el.value : '').replace(/\D/g, '');
  if (code.length !== 4) {
    net.status = 'Please enter a 4-digit code.';
    return showScreen('netfail');
  }
  netConnect(() => netAsk({ t: 'join', code }));
}

/** Send a control message to the server, connecting first if needed. */
function netAsk(obj) {
  if (net.ws && net.ws.readyState === WebSocket.OPEN) net.ws.send(JSON.stringify(obj));
  else netConnect(() => net.ws.send(JSON.stringify(obj)));
}

function closeSocket() {
  const ws = net.ws;
  net.ws = null;                       // clear first so onclose does not fire a screen
  net.code = null;
  net.role = null;
  if (ws) { ws.onclose = null; ws.close(); }
}

function leaveOnline() {
  closeSocket();
  game.mode = '1p';
  game.state = 'title';
  setStripsVisible(false);
  showScreen('title');
}

/* ═══════════════════════════════════════════════════════════════════════
   RENDERING
   ═══════════════════════════════════════════════════════════════════════ */

function drawDesk() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.desk;
  ctx.fillRect(0, 0, view.w, view.h);

  // A faint pool of lamplight so the desk is not a flat field.
  const g = ctx.createRadialGradient(
    view.w / 2, view.h * 0.42, 10,
    view.w / 2, view.h * 0.42, Math.max(view.w, view.h) * 0.72
  );
  g.addColorStop(0, 'rgba(126,132,150,0.10)');
  g.addColorStop(1, 'rgba(126,132,150,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, view.w, view.h);
}

/**
 * The bump. This is thin paper stretched over a point, not a marble:
 * a soft warm shadow pooled down-right, a faint sheen up-left that fades to
 * nothing, and a graphite dot marking exactly where the tip is.
 */
function drawBump(x, y, col) {
  const R = T.BUMP_RADIUS;

  // The shadow does nearly all the work. The paper is already almost white,
  // so a highlight alone cannot describe the shape — what you actually read
  // is the warm shade pooling on the far side of the lift.
  const sg = ctx.createRadialGradient(x + 4.2, y + 5.0, R * 0.10, x + 3.2, y + 4.0, R * 1.34);
  sg.addColorStop(0.00, 'rgba(96,72,42,0.40)');
  sg.addColorStop(0.42, 'rgba(96,72,42,0.24)');
  sg.addColorStop(0.74, 'rgba(96,72,42,0.08)');
  sg.addColorStop(1.00, 'rgba(96,72,42,0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(x + 3.2, y + 4.0, R * 1.34, 0, Math.PI * 2);
  ctx.fill();

  // Sheen, up-left. No rim, fades entirely to nothing — a rim or a bright
  // core would read as a bubble sitting on the page rather than the page
  // itself being lifted from beneath.
  const hg = ctx.createRadialGradient(x - 3.6, y - 4.2, 0, x - 3.6, y - 4.2, R * 0.96);
  hg.addColorStop(0.00, 'rgba(255,253,246,0.50)');
  hg.addColorStop(0.50, 'rgba(255,253,246,0.20)');
  hg.addColorStop(1.00, 'rgba(255,253,246,0)');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(x - 3.6, y - 4.2, R * 0.96, 0, Math.PI * 2);
  ctx.fill();

  // The tip itself — lead pressed against the underside of the sheet. Small,
  // but the one thing on screen a player can aim with, so in a race it carries
  // the identity: same colour for the same player on both phones.
  let ink = col || PLAYER.host;
  const equipped = getEquippedSkin();

  if (!col) {
    if (equipped.id === 'rainbow') {
      const hue = (performance.now() * 0.15) % 360;
      ink = {
        dot: `hsl(${hue}, 100%, 60%)`,
        halo: `hsla(${hue}, 100%, 60%, 0.40)`
      };
    } else if (equipped.id !== 'classic') {
      ink = {
        dot: equipped.dot,
        halo: equipped.halo
      };
    }
  }

  ctx.fillStyle = ink.halo;
  ctx.beginPath();
  ctx.arc(x, y, 4.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = ink.dot;
  ctx.beginPath();
  ctx.arc(x, y, 2.3, 0, Math.PI * 2);
  ctx.fill();
}

/** The 3-2-1 before a race, drawn over the sheet. */
function drawCountdown() {
  const n = Math.ceil(net.countdown / 1000);
  const label = n > 0 ? String(n) : 'GO';
  // Fade each number in as it lands, so it does not just blink.
  const within = (net.countdown % 1000) / 1000;
  const alpha = n > 0 ? 0.35 + 0.55 * (1 - within) : 0.9;

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 96px "Bevan", Georgia, serif';
  ctx.fillStyle = `rgba(20,22,28,${(0.5 * alpha).toFixed(3)})`;
  ctx.fillText(label, START_X + 2, V.H * 0.44 + 3);
  ctx.fillStyle = `rgba(237,230,211,${alpha.toFixed(3)})`;
  ctx.fillText(label, START_X, V.H * 0.44);
  ctx.restore();
}

function render() {
  drawDesk();

  if (!game.sheet || !paperLayer) return;

  let sx = 0, sy = 0;
  if (game.shake > 0) {
    const k = game.shake / T.SHAKE_MS;
    sx = (Math.random() * 2 - 1) * T.SHAKE_MAG * k;
    sy = (Math.random() * 2 - 1) * T.SHAKE_MAG * k;
  }

  const s = view.scale * dpr;
  ctx.setTransform(s, 0, 0, s, view.ox * dpr + sx * s, view.oy * dpr + sy * s);

  // Paper: shadow, fibre, vignette.
  ctx.drawImage(
    paperLayer.cv,
    PAPER.x - paperLayer.pad, PAPER.y - paperLayer.pad,
    PAPER.w + paperLayer.pad * 2, PAPER.h + paperLayer.pad * 2
  );

  // Printed surface: rule lines and holes, clipped to the sheet. This is what
  // the holder shakes; PRINT_MARGIN is what keeps a gap from opening at the
  // edge when it slides.
  const surfaceX = game.surface.x;
  ctx.save();
  ctx.beginPath();
  ctx.rect(PAPER.x, PAPER.y, PAPER.w, PAPER.h);
  ctx.clip();
  ctx.drawImage(
    printLayer.cv,
    PAPER.x - PRINT_MARGIN + surfaceX, PAPER.y,
    PAPER.w + PRINT_MARGIN * 2, PAPER.h
  );
  ctx.restore();

  // Live rendering of oscillating holes (Level 9+)
  if (game.level >= 9 && game.sheet && game.sheet.holes) {
    const timeSec = performance.now() * 0.001;
    ctx.save();
    ctx.translate(surfaceX, 0);
    for (let i = 0; i < game.sheet.holes.length; i++) {
      const h = game.sheet.holes[i];
      if (h.amp > 0) {
        const hx = getHoleX(h, timeSec);
        drawHole(ctx, h, hx);
      }
    }
    ctx.restore();
  }

  // Visual whirlpool danger zone aura for active suction holes (Level 2+)
  if (game.level >= 2 && game.sheet && game.sheet.holes) {
    const levelFactor = Math.min(1, game.level / 12);
    const pullDist = 18 + levelFactor * 36;
    const timeSec = performance.now() * 0.001;
    ctx.save();
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);

    for (let i = 0; i < game.sheet.holes.length; i++) {
      const h = game.sheet.holes[i];
      const hx = getHoleX(h, timeSec) + surfaceX;
      const hy = h.y;

      if (hy < PAPER.y - 30 || hy > PAPER.y + PAPER.h + 30) continue;

      const pulse = 0.5 + 0.5 * Math.sin(timeSec * 2 + h.x * 0.08 + h.y * 0.04);
      const auraR = h.r + 3 + (pullDist - 3) * pulse;

      ctx.strokeStyle = `rgba(190, 110, 240, ${0.14 + levelFactor * 0.20})`;
      ctx.beginPath();
      ctx.arc(hx, hy, auraR, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  const live = game.state === 'ready' || game.state === 'countdown' ||
               game.state === 'playing' || game.state === 'cleared' ||
               game.state === 'watching';

  if (game.mode === 'net') {
    // Two pencils under one sheet. A bump vanishes once that player has
    // dropped through — the pencil is gone, so the paper lies flat again.
    // Theirs is drawn first so that if the two overlap, yours is on top.
    if (live || game.state === 'raceover') {
      if (!net.peerDone || net.peerDone.crossed) {
        drawBump(net.peerShown.x, net.peerShown.y, inkFor(otherRole(net.role)));
      }
      if (!net.myDone || net.myDone.crossed) {
        drawBump(game.tip.x, game.tip.y, inkFor(net.role));
      }
    }
    if (game.state === 'countdown') drawCountdown();
  } else if (live) {
    drawBump(game.tip.x, game.tip.y, PLAYER.host);
  }

  drawFireworks();
}

/* ═══════════════════════════════════════════════════════════════════════
   FIREWORKS SYSTEM
   ═══════════════════════════════════════════════════════════════════════ */

const FIREWORK_COLORS = [
  '#FFD700', '#00F5D4', '#FF3B30', '#FF007F', '#38EF7D', '#FBF7EA', '#00BBFF', '#FF9500'
];

let fireworks = [];
let fireworkRockets = [];
let fireworkTimer = 0;

function launchFirework(targetX, targetY) {
  const startX = targetX || (PLAY_LEFT + Math.random() * PLAY_W);
  const ty = targetY || (PAPER.y + 60 + Math.random() * (PAPER.h * 0.45));
  const sy = PAPER.y + PAPER.h;
  const color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];

  fireworkRockets.push({
    x: startX,
    y: sy,
    targetY: ty,
    vx: (targetX ? (targetX - startX) * 0.04 : (Math.random() * 2 - 1) * 0.8),
    vy: -(9 + Math.random() * 4),
    color: color
  });
}

function explodeFirework(x, y, color) {
  const particleCount = 45 + Math.floor(Math.random() * 25);
  const baseColor = color || FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];

  for (let i = 0; i < particleCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 5.5;
    fireworks.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1.0,
      decay: 0.012 + Math.random() * 0.022,
      gravity: 0.09,
      friction: 0.965,
      size: 1.8 + Math.random() * 2.2,
      color: Math.random() < 0.25 ? FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)] : baseColor,
      sparkle: Math.random() < 0.3
    });
  }
}

function triggerVictoryFireworks(bursts = 4) {
  for (let i = 0; i < bursts; i++) {
    setTimeout(() => {
      const rx = PLAY_LEFT + 40 + Math.random() * (PLAY_W - 80);
      const ry = PAPER.y + 80 + Math.random() * (PAPER.h * 0.4);
      launchFirework(rx, ry);
    }, i * 260);
  }
}

function updateFireworks(dt) {
  // Update rockets
  for (let i = fireworkRockets.length - 1; i >= 0; i--) {
    const r = fireworkRockets[i];
    r.x += r.vx;
    r.y += r.vy;
    r.vy += 0.08;
    if (r.y <= r.targetY || r.vy >= -1) {
      explodeFirework(r.x, r.y, r.color);
      fireworkRockets.splice(i, 1);
    }
  }

  // Update particles
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const p = fireworks[i];
    p.vx *= p.friction;
    p.vy *= p.friction;
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;

    if (p.alpha <= 0) {
      fireworks.splice(i, 1);
    }
  }

  // Continuous show for grand win state
  if (game.state === 'won') {
    fireworkTimer += dt;
    if (fireworkTimer >= 600) {
      fireworkTimer = 0;
      launchFirework();
    }
  }
}

function drawFireworks() {
  ctx.save();
  // Draw rockets
  for (const r of fireworkRockets) {
    ctx.fillStyle = r.color;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(251,247,234,0.6)';
    ctx.beginPath();
    ctx.arc(r.x - r.vx * 1.5, r.y - r.vy * 1.5, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw explosion particles
  for (const p of fireworks) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color;
    if (p.sparkle && Math.random() < 0.4) {
      ctx.fillStyle = '#FFFFFF';
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════
   LOOP
   ═══════════════════════════════════════════════════════════════════════ */

let last = performance.now();

function frame(now) {
  // Rescheduled FIRST, and the body guarded below. Previously this sat at the
  // bottom, so any exception mid-frame stopped the loop being queued again and
  // the game froze for good — one malformed packet from the other phone was
  // enough to do it.
  requestAnimationFrame(frame);
  try {
    step(now);
  } catch (err) {
    if (!frame.warned) { frame.warned = true; console.error('frame error', err); }
  }
}

function step(now) {
  const dt = Math.min(50, now - last);
  last = now;

  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt);
  updateFireworks(dt);

  // The other pencil is eased outside the state check on purpose: once you are
  // out, your own run is over but theirs is not, and their bump has to keep
  // moving on your screen rather than freezing where you left it.
  if (game.mode === 'net') {
    const k = Math.min(1, dt / 55);
    net.peerShown.x += (net.peerTip.x - net.peerShown.x) * k;
    net.peerShown.y += (net.peerTip.y - net.peerShown.y) * k;
    if (game.state === 'watching') updateHud();
  }

  if (game.state === 'countdown') {
    net.countdown -= dt;
    if (net.countdown <= 0) {
      net.countdown = 0;
      game.state = 'playing';
      game.elapsed = 0;          // the clock starts on GO, not on the tap
    }
  } else if (game.state === 'playing') {
    game.elapsed += dt;

    // Both devices run the same recharge clock from the start of the round.
    // The holder is authoritative — every shake message carries the true count
    // — so this only has to be close, and it keeps the pencil's pips honest
    // between shakes. Races have no holder, so no charges.
    if (game.mode === '2p' && game.charges < T.SHAKE_CHARGES) {
      game.rechargeT += dt;
      while (game.rechargeT >= T.SHAKE_RECHARGE_MS && game.charges < T.SHAKE_CHARGES) {
        game.rechargeT -= T.SHAKE_RECHARGE_MS;
        game.charges++;
        updatePips();
      }
    }

    if (!amPencil()) {
      // Holder's screen on a shared device. No collision here at all.
      const k = Math.min(1, dt / 55);
      game.tip.x += (net.peerTip.x - game.tip.x) * k;
      game.tip.y += (net.peerTip.y - game.tip.y) * k;
      stepSurface(dt);
    } else {
      // Keyboard nudges the same target the finger drives.
      let kx = 0, ky = 0;
      if (game.keys.left)  kx -= 1;
      if (game.keys.right) kx += 1;
      if (game.keys.up)    ky -= 1;
      if (game.keys.down)  ky += 1;
      if (kx || ky) {
        const len = Math.hypot(kx, ky) || 1;
        const d = T.KEY_SPEED * (dt / 1000);
        setTarget(game.target.x + (kx / len) * d, game.target.y + (ky / len) * d);
      }

      // Continuously apply gravitational suction pull to target (pulls stationary tips!)
      if (game.mode === '1p') {
        const suction = getHoleSuctionOffset(game.tip.x, game.tip.y, game.level);
        if (suction.dx || suction.dy) {
          const k = dt / 16.6;
          game.target.x = clampX(game.target.x + suction.dx * k);
          game.target.y = clampY(game.target.y + suction.dy * k);
        }
      }

      // One swept move per frame, resolving tip travel and sheet travel
      // together. Order matters: the surface has to advance first so the sweep
      // spans where it was to where it now is.
      const surfWas = game.surface.x;
      stepSurface(dt);
      advanceTip(game.target.x, game.target.y, surfWas, game.surface.x);

      // Roughly 20 updates a second is plenty for a bump that moves slowly.
      // advanceTip above may have ended my run, in which case 'done' has
      // already gone out and a trailing position would arrive after it.
      if (game.mode === 'net' && game.state === 'playing' &&
          now - net.lastSent >= T.TIP_SEND_MS) {
        net.lastSent = now;
        netSend({ k: 'tip', x: +game.tip.x.toFixed(1), y: +game.tip.y.toFixed(1) });
      }
    }

    updateHud();
  } else if (game.surface.x !== 0 || game.surface.v !== 0) {
    // Let the sheet settle visually after a round ends.
    stepSurface(dt);
  }

  render();
}

/* ═══════════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════════ */

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
document.addEventListener('gesturestart', (e) => e.preventDefault());

// A sheet behind the title card, so the first thing seen is the game.
game.runSeed = (Math.random() * 0xFFFFFFFF) >>> 0;
game.sheet = generateSheet(1, sheetSeed(game.runSeed, 1));
resize();
showScreen('title');
updateSoundButton();
const btnSound = document.getElementById('btn-sound');
if (btnSound) btnSound.addEventListener('click', toggleSound);
requestAnimationFrame(frame);

// Rebuild the paper texture once webfonts land, so the printed labels use
// Courier Prime rather than the fallback.
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => rebuildLayers());
}
</script>
</body>
</html>
