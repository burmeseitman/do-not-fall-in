<style>

    --paper:    #EDE6D3;

    top: max(12px, env(safe-area-inset-top));
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--dim);
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    z-index: 100;

  #hud #hud-sheet, #hud #hud-time {

  #hud.hidden #hud-sheet, #hud.hidden #hud-time {

  /* ---- Screens ------------------------------------------------------ */

  /* ---- Shake strips (two-player only) ------------------------------- */
  #strips { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
  #strips[hidden] { display: none; }

  /* The touch target runs the full width of the un-punched margin, but the
     visible band stops a bump-radius short of it. Otherwise the pencil parked
     against its clamp would have half the bump — and the graphite dot marking
     the tip — sitting underneath the strip. */
  .strip {
    position: absolute;
    top: 0; bottom: 0;
    width: 56px;
    margin: 0;
    border: 0;
    background: transparent;
    pointer-events: auto;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    -webkit-user-select: none; user-select: none;
  }
  .strip::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: var(--band, 100%);
    background: rgba(20, 22, 28, 0.62);
    transition: background 90ms linear;
  }
  .strip > * { position: relative; }

  .strip.left  { left: 0;  padding-right: calc(100% - var(--band, 100%)); }
  .strip.right { right: 0; padding-left:  calc(100% - var(--band, 100%)); }
  .strip.left::before  { left: 0;  border-right: 1px solid rgba(168,188,203,0.14); }
  .strip.right::before { right: 0; border-left:  1px solid rgba(168,188,203,0.14); }

  .strip.flash::before { background: rgba(232, 199, 122, 0.26); }
  .strip.empty { opacity: 0.4; }

  .strip .label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #A9A69C;

    box-shadow: inset 0 0 0 1px rgba(237,230,211,0.22);

</style>

<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud">
    <span id="hud-sheet">SHEET 1 / 12</span>
    <span style="display:flex; align-items:center; gap:10px;">
      <button id="btn-sound" style="background:none; border:none; color:inherit; font:inherit; cursor:pointer; padding:0 4px; pointer-events:auto;" aria-label="Toggle sound">🔊</button>

    <button class="strip right" id="strip-r" aria-label="Shake the sheet from the right">

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════
   WEB AUDIO API SYNTHESIZER (ROCK-SOLID AUTO-UNLOCK)
   ═══════════════════════════════════════════════════════════════════════ */

let audioCtx = null;
let soundMuted = localStorage.getItem('dont_fall_in_muted') === 'true';

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  // Unlock iOS Safari / Mobile webkit audio context with silent buffer
  if (audioCtx && !initAudio.unlocked) {
    try {
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
      initAudio.unlocked = true;
    } catch {}
  }
}

// Auto-unlock audio context on first user interaction anywhere
window.addEventListener('pointerdown', initAudio, { passive: true });
window.addEventListener('touchstart', initAudio, { passive: true });
window.addEventListener('keydown', initAudio, { passive: true });
window.addEventListener('click', initAudio, { passive: true });

function updateSoundButton() {
  const btn = document.getElementById('btn-sound');
  if (btn) {
    btn.innerHTML = soundMuted ? '🔇 <span style="opacity:0.75">Muted</span>' : '🔊 <span style="opacity:0.9">Sound</span>';
  }
}

function toggleSound() {
  initAudio();
  soundMuted = !soundMuted;
  localStorage.setItem('dont_fall_in_muted', String(soundMuted));
  updateSoundButton();
  if (!soundMuted) soundClick();
}

function playSynthTone(freqs, type, duration, vol = 0.15) {
  if (soundMuted) return;
  initAudio();
  if (!audioCtx) return;

  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';

    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(Math.max(0.0001, vol), now);
    gain.gain.linearRampToValueAtTime(0.0001, now + duration);

    if (Array.isArray(freqs)) {
      const f0 = Math.max(20, freqs[0] || 440);
      osc.frequency.setValueAtTime(f0, now);
      if (freqs.length > 1) {
        const f1 = Math.max(20, freqs[1] || f0);
        osc.frequency.exponentialRampToValueAtTime(f1, now + duration);
      }
    } else {
      osc.frequency.setValueAtTime(Math.max(20, freqs || 440), now);
    }

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch {}
}

function soundDrop() {
  playSynthTone([420, 90], 'sine', 0.35, 0.25);
}

function soundShake() {
  playSynthTone([180, 55], 'triangle', 0.15, 0.28);
}

function soundClick() {
  playSynthTone(550, 'sine', 0.04, 0.08);
}

function soundVictory() {
  if (soundMuted) return;
  initAudio();
  if (!audioCtx) return;

  const notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach((freq, idx) => {
    setTimeout(() => {
      playSynthTone(freq, 'sine', 0.25, 0.12);
    }, idx * 90);
  });
}

const SKINS = [
  { id: 'classic',  name: 'Classic Lead',   stars: 0,  dot: '#3B3F48', halo: 'rgba(59,63,72,0.22)',   badge: '✏️' },
  { id: 'ruby',     name: 'Crimson Ruby',   stars: 6,  dot: '#E84A5F', halo: 'rgba(232,74,95,0.30)',  badge: '🔴' },
  { id: 'electric', name: 'Electric Neon',  stars: 15, dot: '#00F5D4', halo: 'rgba(0,245,212,0.35)',  badge: '⚡' },
  { id: 'gold',     name: 'Golden Master',  stars: 27, dot: '#FFD700', halo: 'rgba(255,215,0,0.40)',  badge: '🌟' },
  { id: 'rainbow',  name: 'Rainbow Cycle',  stars: 36, dot: 'rainbow', halo: 'rainbow',               badge: '🌈' },
];

function getTotalStars() {
  let total = 0;
  if (stats && stats.sp && stats.sp.levels) {
    for (let i = 1; i <= T.LEVELS; i++) {
      const l = stats.sp.levels[String(i)];
      if (l && l.stars) total += l.stars;
    }
  }
  return total;
}

function getEquippedSkin() {
  const savedId = localStorage.getItem('dont_fall_in_skin') || 'classic';
  const skin = SKINS.find(s => s.id === savedId) || SKINS[0];
  const totalStars = getTotalStars();
  if (skin.stars > totalStars) return SKINS[0];
  return skin;
}

function equipSkin(skinId) {
  localStorage.setItem('dont_fall_in_skin', skinId);
}

const PID_KEY = 'dont_fall_in_pid';
const NAME_KEY = 'dont_fall_in_name';

function getPlayerId() {
  let pid = localStorage.getItem(PID_KEY);
  if (!pid) {
    const arr = new Uint8Array(4);
    crypto.getRandomValues(arr);
    pid = Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
    localStorage.setItem(PID_KEY, pid);
  }
  return pid;
}

function getPlayerName() {
  return localStorage.getItem(NAME_KEY) || '';
}

function setPlayerName(name) {
  localStorage.setItem(NAME_KEY, (name || '').trim().slice(0, 14));
}

/** Submit score to server. Fire-and-forget, non-blocking. */
async function submitGlobalScore(level, timeMs) {
  const name = getPlayerName();
  if (!name) return;  // no name = don't submit
  try {
    const res = await fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pid: getPlayerId(), name, level, time: Math.round(timeMs) })
    });
    const data = await res.json();
    if (data.ok) game.globalRank = data.rank;
  } catch {}
}

let leaderboardCache = null;

async function fetchLeaderboard() {
  const el = document.getElementById('stats-body');
  if (el) el.innerHTML = '<p class="stat">Loading…</p>';
  try {
    const res = await fetch('/api/leaderboard');
    leaderboardCache = await res.json();
    renderGlobalTab(1);
  } catch {
    if (el) el.innerHTML = '<p style="color:#E8746C;font-family:var(--mono);font-size:13px">Failed to load leaderboard.</p>';
  }
}

function renderGlobalTab(level) {
  const el = document.getElementById('stats-body');
  if (!el || !leaderboardCache) return;
  const entries = leaderboardCache.levels[String(level)] || [];
  const pid = getPlayerId();

  let btns = '';
  for (let i = 1; i <= 12; i++) {
    btns += `<button class="lvl-btn${i === level ? ' active' : ''}" data-lv="${i}">${i}</button>`;
  }

  let rows = '';
  if (entries.length === 0) {
    rows = '<p style="color:#3A3F4B;font-family:var(--mono);font-size:13px;margin:16px 0">No scores yet. Be the first!</p>';
  } else {
    entries.forEach((e, idx) => {
      const isMe = e.pid === pid;
      rows += `<div class="level-row${isMe ? ' my-row' : ''}">
        <span class="lv-num">#${idx + 1}</span>
        <span class="lv-stars" style="flex:2">${esc(e.n)}${isMe ? ' ★' : ''}</span>
        <span class="lv-stars">${starsHtml(e.s)}</span>
        <span class="lv-time">${(e.t / 1000).toFixed(1)}s</span>
      </div>`;
    });
  }

  el.innerHTML = `<div class="lvl-selector">${btns}</div>${rows}`;

  el.querySelectorAll('.lvl-btn').forEach(btn => {
    btn.onclick = () => { soundClick(); renderGlobalTab(Number(btn.dataset.lv)); };
  });
}

const STATS_KEY = 'dont_fall_in_stats';

function defaultStats() {
  return {
    v: 1,
    sp: { levels: {}, allCleared: false },
    dp: { played: 0, p1Wins: 0, p2Wins: 0, draws: 0 },
    net: { played: 0, wins: 0, losses: 0 }
  };
}

let stats = loadStats();

function loadStats() {
  try {
    const raw = localStorage.getItem(STATS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.v === 1) return parsed;
    }
  } catch {}
  return defaultStats();
}

function saveStats() {
  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch {}
}

function resetStats() {
  stats = defaultStats();
  saveStats();
}

/**
 * Star thresholds scale with level difficulty.
 * L1: 3★ ≤ 6.5s, 2★ ≤ 13s   |   L6: 3★ ≤ 14s, 2★ ≤ 28s   |   L12: 3★ ≤ 23s, 2★ ≤ 46s
 */
function getStars(level, timeMs) {
  const base = 5000 + level * 1500;
  if (timeMs <= base) return 3;
  if (timeMs <= base * 2) return 2;
  return 1;
}

function recordLevelResult(level, timeMs, crossed) {
  const key = String(level);
  if (!stats.sp.levels[key]) {
    stats.sp.levels[key] = { best: null, stars: 0, attempts: 0, clears: 0 };
  }
  const lv = stats.sp.levels[key];
  lv.attempts++;
  if (crossed) {
    lv.clears++;
    const s = getStars(level, timeMs);
    if (s > lv.stars) lv.stars = s;
    if (lv.best === null || timeMs < lv.best) lv.best = timeMs;
  }
  let allDone = true;
  for (let i = 1; i <= 12; i++) {
    const l = stats.sp.levels[String(i)];
    if (!l || l.clears === 0) { allDone = false; break; }
  }
  stats.sp.allCleared = allDone;
  saveStats();
}

function recordDuel(winner) {
  stats.dp.played++;
  if (winner === 'p1') stats.dp.p1Wins++;
  else if (winner === 'p2') stats.dp.p2Wins++;
  else stats.dp.draws++;
  saveStats();
}

function recordRace(won) {
  stats.net.played++;
  if (won) stats.net.wins++;
  else stats.net.losses++;
  saveStats();
}

function starsHtml(count) {
  let h = '';
  for (let i = 0; i < 3; i++) {
    h += i < count ? '⭐' : '<span class="star-off">☆</span>';
  }
  return h;
}

function buildStatsTab(tab) {
  if (tab === 'sp') {
    let totalStars = 0;
    let rows = '';
    for (let i = 1; i <= 12; i++) {
      const l = stats.sp.levels[String(i)];
      if (l && l.clears > 0) {
        totalStars += l.stars;
        rows += `<div class="level-row">
          <span class="lv-num">Lv${i}</span>
          <span class="lv-stars">${starsHtml(l.stars)}</span>
          <span class="lv-time">${(l.best / 1000).toFixed(1)}s</span>
        </div>`;
      } else {
        const attempts = l ? l.attempts : 0;
        rows += `<div class="level-row">
          <span class="lv-num">Lv${i}</span>
          <span class="lv-stars">${starsHtml(0)}</span>
          <span class="lv-time" style="color:#3A3F4B">${attempts > 0 ? attempts + ' tries' : '—'}</span>
        </div>`;
      }
    }
    return `
      <div class="level-grid">${rows}</div>
      <p class="stat">Total ⭐ ${totalStars} / 36</p>
      ${stats.sp.allCleared ? '<p class="stat" style="color:#E8C77A">🏆 All 12 Levels Cleared!</p>' : ''}`;
  } else if (tab === 'dp') {
    const d = stats.dp;
    const total = d.p1Wins + d.p2Wins + d.draws;
    if (total === 0) return '<p style="color:#3A3F4B;font-family:var(--mono);font-size:13px;margin:16px 0">No duels played yet.</p>';
    const p1Pct = Math.round(d.p1Wins / total * 100);
    const p2Pct = Math.round(d.p2Wins / total * 100);
    const drPct = 100 - p1Pct - p2Pct;
    return `
      <div class="stat-row"><span>Duels Played</span><span class="stat-val">${d.played}</span></div>
      <div class="dp-bar">
        <div class="dp-bar-p1" style="width:${p1Pct}%"></div>
        <div class="dp-bar-draw" style="width:${drPct}%"></div>
        <div class="dp-bar-p2" style="width:${p2Pct}%"></div>
      </div>
      <div class="stat-row"><span>P1 Wins</span><span class="stat-val">${d.p1Wins}</span></div>
      <div class="stat-row"><span>P2 Wins</span><span class="stat-val">${d.p2Wins}</span></div>
      <div class="stat-row"><span>Draws</span><span class="stat-val">${d.draws}</span></div>`;
  } else {
    const n = stats.net;
    if (n.played === 0) return '<p style="color:#3A3F4B;font-family:var(--mono);font-size:13px;margin:16px 0">No online races yet.</p>';
    return `
      <div class="stat-row"><span>Races Played</span><span class="stat-val">${n.played}</span></div>
      <div class="stat-row"><span>Wins</span><span class="stat-val">${n.wins}</span></div>
      <div class="stat-row"><span>Losses</span><span class="stat-val">${n.losses}</span></div>
      <div class="stat-row"><span>Win Rate</span><span class="stat-val">${Math.round(n.wins / n.played * 100)}%</span></div>`;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   TUNING — the numbers worth changing are all here.
   ═══════════════════════════════════════════════════════════════════════ */

const T = {
  // --- Difficulty curve (level is 1-based; at level 12 both clamps bite) ---
  //
  // Small holes, lots of them. The governing constraint is that a hole blocks
  // a disc of (radius + TIP_RADIUS + 1), so a crossable corridor needs
  //     spacing > 2 * (radius + TIP_RADIUS + 1)
  // and everything below is chosen to keep that positive to the last level:
  //
  //   lv | radius spacing | holes | corridor | honest | straight-line lanes
  //    1 |    5.4    54.1 |    96 |   32.3px |   100% | 14.0%
  //    4 |    6.6    48.4 |   119 |   24.2px |   100% |  2.6%
  //    8 |    8.2    40.8 |   160 |   13.4px |   100% |  0.1%
  //   10 |    9.0    37.0 |   189 |    8.0px |   100% |  0.0%
  //   12 |    9.5    34.0 |   230 |    4.0px |    94% |  0.0%
  //
  // The last column is the share of straight vertical lines that reach the
  // finish untouched — the trivial-win rate. Level 1 is meant to be winnable
  // by luck; from level 10 there is no straight line through at all.
  //
  // Shrink the radius further and the counts climb again, but the corridor
  // closes: a 8.5 cap at 30 spacing drops level 12 to a 16% pass rate and the
  // prune-until-passable fallback starts eating holes at random, which looks
  // chewed rather than tight. If you widen these holes, raise the spacing to
  // match or that fallback is what you will get.
  LEVELS:            12,
  spacingFor: (lv) => Math.max(34, 56 - lv * 1.9),
  radiusFor:  (lv) => Math.min(9.5, 5.0 + lv * 0.4),
  JITTER_FRAC:       0.30,   // jitter = spacing * this
  RADIUS_VARY:       0.18,   // per-hole radius varies +/- this fraction

  // --- Feel ---
  TIP_RADIUS:        4.5,    // clearance assumed by the solvability check;
                             // scaled down with the holes to keep the verifier
                             // honest rather than over-cautious
  HOLE_FORGIVENESS:  1.5,    // px shaved off hole radius for the fall test
  COLLISION_STEP:    1.5,    // segment sampling interval, px
  GRAB_RADIUS_PX:    46,     // press must land this close (screen px) to grab
  MIN_ABOVE_FINGER:  26,     // bump is nudged at least this far above the touch
  KEY_SPEED:         320,    // arrow-key travel, virtual px/sec

  // --- Sheet layout (virtual units) ---
  START_BAND:        92,     // hole-free band at the bottom of the paper
  FINISH_BAND:       84,     // hole-free band at the top of the paper
  PLAY_INSET:        46,     // clean un-punched margin down each side of the
                             // sheet. Doubles as the tip clamp — see PLAY_LEFT
  WALL_INSET:        6,      // flood-fill blocks this far inside the band

  // --- Two players on one device ---
  TWO_P_LEVEL:       6,      // the duel runs one sheet; this is its difficulty
  SHAKE_STIFFNESS:   190,    // spring pulling the printed surface back
  SHAKE_DAMPING:     11,     // under-damped, so it overshoots and settles
  SHAKE_IMPULSE:     430,    // sideways kick per shake, virtual px/sec
  SHAKE_CHARGES:     3,      // shakes the holder can hold at once
  SHAKE_RECHARGE_MS: 3000,   // one charge back every this long
  SHAKE_STRIP:       56,     // strip width in VIRTUAL units — never screen px,
                             // or two phones would disagree over the network

  // --- Two players on two phones (a race: both drag, nobody holds) ---
  RACE_COUNTDOWN_MS: 2600,   // both phones count down together before GO, so
                             // the start is not skewed by who tapped begin
  MAX_NAME:          14,     // characters kept from a player's name, enforced
                             // on entry AND again on arrival from the peer
  RACE_START_SPLIT:  62,     // how far either side of centre each pencil starts.
                             // Not lanes: the start band is hole-free right
                             // across, so either player can walk sideways to
                             // any entry point before climbing
  TIP_SEND_MS:       45,     // pencil broadcasts its position this often.
                             // Just under 50 on purpose: the check runs once a
                             // frame, so 50 would quantise to every 4th frame
                             // (15/s) at 60fps rather than every 3rd (20/s)

  // --- Solvability ---
  FILL_GRID:         5,      // flood-fill cell size, px
  MAX_ATTEMPTS:      40,     // regenerate this many times before pruning

  // --- Presentation ---
  BUMP_RADIUS:       15,     // visual size of the paper bump
  SHAKE_MS:          420,
  SHAKE_MAG:         9,
};

/* The play field is a fixed virtual portrait rectangle, scaled and
   letterboxed onto whatever screen we get. Everything in the game logic is
   expressed in these units, so the same seed yields the same sheet on any
   device — which is what Phase 3 depends on. */
const V = { W: 420, H: 780 };
const PAPER = { x: 10, y: 14, w: 400, h: 752 };

/* The punched band. Holes sit in the middle of the sheet, leaving a clean
   printed margin down either side — and the tip is confined to exactly the
   same band. Those two have to move together: a hole-free margin the tip
   could still enter is just a free corridor to slide up, which would make
   every sheet trivial. Out of bounds and un-punched are the same edge. */
/* The band is additionally held clear of the shake strips, and BOTH modes use
   these same bounds — for the tip clamp and for the flood fill alike. If one
   player mode allowed a wider corridor than the other, a sheet verified in one
   could be uncrossable in the other, and the duel runs the identical sheet for
   both players. Virtual units throughout, so two phones agree in Phase 3. */
const PLAY_LEFT  = Math.max(PAPER.x + T.PLAY_INSET, T.SHAKE_STRIP);
const PLAY_RIGHT = Math.min(PAPER.x + PAPER.w - T.PLAY_INSET, V.W - T.SHAKE_STRIP);
const PLAY_W     = PLAY_RIGHT - PLAY_LEFT;

const HOLE_MIN_Y = PAPER.y + T.FINISH_BAND;
const HOLE_MAX_Y = PAPER.y + PAPER.h - T.START_BAND;
const FINISH_Y   = PAPER.y + T.FINISH_BAND;
const START_Y    = PAPER.y + PAPER.h - 44;
const START_X    = PAPER.x + PAPER.w / 2;

const C = {
  desk:     '#191B21',
  paper:    '#EDE6D3',
  rule:     '#A8BCCB',
  margin:   '#C0554C',
  graphite: '#3B3F48',
  void:     '#0B0C0F',
};

/*
 * Race identities. Keyed by role, NOT by whose screen it is, so a player is
 * the same colour on both phones — "I'm the red one" has to be true for both
 * of you or it is worse than no colour at all.
 *
 * Two pencils you would actually find in a pencil case: graphite and a red
 * marking pencil. Only the tip is tinted; the bump itself is lifted paper and
 * stays paper-coloured whoever is underneath it.
 */
/*
 * Two colours per player, and they are not the same colour:
 *   dot/halo — the tip on the canvas, sitting on pale paper, so it is DARK
 *   ui       — the same identity as a label on a dark card, so it is LIGHT
 * Using the canvas colour for text puts near-black graphite on a near-black
 * card, which is unreadable.
 */
const PLAYER = {
  host:  { name: 'Graphite', ui: '#B9BEC9',
           dot: 'rgba(43,46,54,0.94)',   halo: 'rgba(59,63,72,0.20)' },
  guest: { name: 'Red',      ui: '#D8695C',
           dot: 'rgba(168,58,46,0.94)',  halo: 'rgba(168,58,46,0.22)' },
};

const otherRole = (r) => (r === 'guest' ? 'host' : 'guest');

/** Never throws on an unset role — a colour lookup must not take out a screen. */
const inkFor = (role) => PLAYER[role] || PLAYER.host;

/** Where each pencil begins. Host to the left of centre, guest to the right. */
function startXFor(role) {
  if (game.mode !== 'net') return START_X;
  return role === 'guest' ? START_X + T.RACE_START_SPLIT
                          : START_X - T.RACE_START_SPLIT;
}

/* ═══════════════════════════════════════════════════════════════════════
   SEEDED RANDOMNESS
   Every random value that affects what the player sees runs through one of
   these streams. Phase 3 replaces the seed source with the server's seed and
   nothing else has to change.
   ═══════════════════════════════════════════════════════════════════════ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Seed for one sheet, derived from the run seed so a run is reproducible. */
function sheetSeed(runSeed, level) {
  return (runSeed + Math.imul(level, 0x9E3779B1)) >>> 0;
}

/* ═══════════════════════════════════════════════════════════════════════
   SHEET GENERATION
   ═══════════════════════════════════════════════════════════════════════ */

/** Irregular 11-point outline factors, so holes read as punched not drilled. */
function polyFactors(rand) {
  const f = [];
  for (let i = 0; i < 11; i++) f.push(0.93 + rand() * 0.14);
  return f;
}

/**
 * Lay holes out on an offset (staggered) grid with jitter and varied radii.
 *
 * Every row also gets a guard hole pinned to each edge of the band. Without
 * them the staggered rows leave a clear lane straight up the boundary, and
 * since the tip clamps to exactly that boundary the whole sheet can be beaten
 * by holding against the edge and pulling up. Big holes used to cover the
 * boundary incidentally; small ones do not, so the coverage is made explicit.
 */
function layoutHoles(rand, spacing, radius, jitter) {
  const holes = [];
  const rowStep = spacing * 0.86;

  // Draw order is fixed so a given seed always yields the same sheet.
  const makeHole = (x, y, guardEdge) => {
    const r = radius * (1 - T.RADIUS_VARY + rand() * T.RADIUS_VARY * 2);
    // A guard may only wander as far as it can while still covering the edge
    // it is guarding — otherwise it stops being a guard.
    const spread = guardEdge
      ? Math.min(jitter, Math.max(0, r - T.HOLE_FORGIVENESS - 0.5))
      : jitter;
    const hx = Math.max(PLAY_LEFT, Math.min(PLAY_RIGHT, x + (rand() * 2 - 1) * spread));
    const hy = Math.max(HOLE_MIN_Y, Math.min(HOLE_MAX_Y, y + (rand() * 2 - 1) * jitter));
    holes.push({ x: hx, y: hy, r, shape: polyFactors(rand) });
  };

  let row = 0;
  for (let y = HOLE_MIN_Y + rowStep * 0.5; y <= HOLE_MAX_Y; y += rowStep, row++) {
    const stagger = (row % 2) ? spacing / 2 : 0;

    makeHole(PLAY_LEFT, y, true);
    makeHole(PLAY_RIGHT, y, true);

    // No columns are skipped near the guards. Letting one occasionally land on
    // top of a guard costs a redundant hole; skipping them opens a dead lane
    // just inside the edge, which is far worse.
    for (let x = PLAY_LEFT + stagger; x <= PLAY_RIGHT; x += spacing) {
      makeHole(x, y, false);
    }
  }
  return holes;
}

/**
 * Flood fill on a coarse grid: can the tip get from the start band to the
 * finish band at all? Cells are blocked within (hole radius + tip radius + 1)
 * of a hole centre, and along both side walls so the tip cannot simply slide
 * up the edge of the paper.
 */
function isPassable(holes) {
  const g = T.FILL_GRID;
  const cols = Math.ceil(PLAY_W / g);
  const rows = Math.ceil(PAPER.h / g);
  const blocked = new Uint8Array(cols * rows);

  // Side walls.
  const wallCells = Math.ceil(T.WALL_INSET / g);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < wallCells; c++) {
      blocked[r * cols + c] = 1;
      blocked[r * cols + (cols - 1 - c)] = 1;
    }
  }

  // Stamp each hole's blocked disc rather than testing every cell against
  // every hole — keeps 40 regeneration attempts imperceptible.
  for (const h of holes) {
    const rr = h.r + T.TIP_RADIUS + 1;
    const rr2 = rr * rr;
    const cx = (h.x - PLAY_LEFT) / g;
    const cy = (h.y - PAPER.y) / g;
    const span = rr / g;
    const c0 = Math.max(0, Math.floor(cx - span)), c1 = Math.min(cols - 1, Math.ceil(cx + span));
    const r0 = Math.max(0, Math.floor(cy - span)), r1 = Math.min(rows - 1, Math.ceil(cy + span));
    for (let r = r0; r <= r1; r++) {
      const py = PAPER.y + (r + 0.5) * g;
      const dy = py - h.y;
      for (let c = c0; c <= c1; c++) {
        const px = PLAY_LEFT + (c + 0.5) * g;
        const dx = px - h.x;
        if (dx * dx + dy * dy < rr2) blocked[r * cols + c] = 1;
      }
    }
  }

  // BFS up from the bottom row.
  const seen = new Uint8Array(cols * rows);
  const queue = new Int32Array(cols * rows);
  let head = 0, tail = 0;
  for (let c = 0; c < cols; c++) {
    const i = (rows - 1) * cols + c;
    if (!blocked[i]) { seen[i] = 1; queue[tail++] = i; }
  }
  while (head < tail) {
    const i = queue[head++];
    const r = (i / cols) | 0, c = i - r * cols;
    if (r === 0) return true;
    if (c > 0)        { const n = i - 1;    if (!seen[n] && !blocked[n]) { seen[n] = 1; queue[tail++] = n; } }
    if (c < cols - 1) { const n = i + 1;    if (!seen[n] && !blocked[n]) { seen[n] = 1; queue[tail++] = n; } }
    if (r > 0)        { const n = i - cols; if (!seen[n] && !blocked[n]) { seen[n] = 1; queue[tail++] = n; } }
    if (r < rows - 1) { const n = i + cols; if (!seen[n] && !blocked[n]) { seen[n] = 1; queue[tail++] = n; } }
  }
  return false;
}

/**
 * Build a sheet that is guaranteed crossable. A sheet the player cannot get
 * through must never reach the screen, so we verify before returning and fall
 * back to deleting holes if the layout parameters are simply too mean.
 */
function generateSheet(level, seed) {
  const spacing = T.spacingFor(level);
  const radius  = T.radiusFor(level);
  const jitter  = spacing * T.JITTER_FRAC;

  const rand = mulberry32(seed);
  let holes = null;

  for (let attempt = 0; attempt < T.MAX_ATTEMPTS; attempt++) {
    holes = layoutHoles(rand, spacing, radius, jitter);
    if (isPassable(holes)) {
      break;
    }
  }

  if (!holes || !isPassable(holes)) {
    // Thin out until passable
    while (holes.length > 0 && !isPassable(holes)) {
      holes.splice(Math.floor(rand() * holes.length), 1);
    }
  }

  // Assign moving hole properties for Level 9+ (Shifting Corridors mode)
  if (level >= 9) {
    const moveRate = Math.min(0.45, 0.15 + (level - 9) * 0.10);
    for (let i = 0; i < holes.length; i++) {
      if (rand() < moveRate) {
        holes[i].baseX = holes[i].x;
        holes[i].amp = 10 + rand() * 18;
        holes[i].freq = 1.2 + rand() * 1.5;
        holes[i].phase = rand() * Math.PI * 2;
      }
    }
  }

  return { level, seed, spacing, radius, holes };
}

/* ═══════════════════════════════════════════════════════════════════════
   OFFSCREEN LAYERS
   Two of them, deliberately:
     paperLayer — the sheet itself: shadow, fibre, vignette. Never moves.
     printLayer — what is printed and punched: rule lines, then holes on top.
                  Phase 2 slides this sideways when the holder shakes.
   ═══════════════════════════════════════════════════════════════════════ */

const PRINT_MARGIN = 56;   // extra width so a sideways slide never shows a gap

let paperLayer = null;
let printLayer = null;
let layerScale = 0;

function makeLayer(w, h, rs) {
  const cv = document.createElement('canvas');
  cv.width  = Math.ceil(w * rs);
  cv.height = Math.ceil(h * rs);
  const c = cv.getContext('2d');
  c.scale(rs, rs);
  return { cv, c };
}

function buildPaperLayer(rs, seed) {
  const pad = 26;                      // room for the drop shadow onto the desk
  const { cv, c } = makeLayer(PAPER.w + pad * 2, PAPER.h + pad * 2, rs);
  const rand = mulberry32(seed ^ 0x5F356495);

  // Drop shadow onto the desk.
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.55)';
  c.shadowBlur = 20;
  c.shadowOffsetX = 2;
  c.shadowOffsetY = 8;
  c.fillStyle = C.paper;
  c.fillRect(pad, pad, PAPER.w, PAPER.h);
  c.restore();

  c.save();
  c.beginPath();
  c.rect(pad, pad, PAPER.w, PAPER.h);
  c.clip();

  // Aged base.
  c.fillStyle = C.paper;
  c.fillRect(pad, pad, PAPER.w, PAPER.h);

  // Fibre speckle — half light, half dark, roughly a pixel each.
  const dots = Math.round((PAPER.w * PAPER.h) / 118);
  for (let i = 0; i < dots; i++) {
    const x = pad + rand() * PAPER.w;
    const y = pad + rand() * PAPER.h;
    c.fillStyle = (rand() < 0.5)
      ? 'rgba(255,255,248,0.42)'
      : 'rgba(74,62,42,0.16)';
    c.fillRect(x, y, 1, 1);
  }

  // Vignette: corners age darker than the middle.
  const vg = c.createRadialGradient(
    pad + PAPER.w / 2, pad + PAPER.h / 2, PAPER.w * 0.24,
    pad + PAPER.w / 2, pad + PAPER.h / 2, PAPER.h * 0.62
  );
  vg.addColorStop(0.00, 'rgba(96,78,48,0)');
  vg.addColorStop(0.62, 'rgba(96,78,48,0.07)');
  vg.addColorStop(1.00, 'rgba(72,56,32,0.26)');
  c.fillStyle = vg;
  c.fillRect(pad, pad, PAPER.w, PAPER.h);

  c.restore();
  return { cv, c, pad };
}

/**
 * One hole: pale torn lip, brown ring, then the near-black void.
 *
 * The lip and ring are scaled by the specified 1.18x / 1.10x, but with an
 * absolute floor as well. A bare 1.18x lip on a 6px hole is barely a pixel and
 * vanishes against the paper, leaving something that reads as a printed dot
 * rather than a punched hole. The floor is deliberately small — push it much
 * past 2px and these holes turn into thick pale donuts instead.
 */
function drawHole(c, h, customX) {
  const lipR  = Math.max(h.r * 1.18, h.r + 1.9);
  const ringR = Math.max(h.r * 1.10, h.r + 1.0);
  const hx = customX != null ? customX : h.x;

  const path = (radius) => {
    c.beginPath();
    for (let i = 0; i < 11; i++) {
      const a = (i / 11) * Math.PI * 2;
      const r = radius * h.shape[i];
      const x = hx + Math.cos(a) * r;
      const y = h.y + Math.sin(a) * r;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.closePath();
  };

  // Torn lip — paper fibres pushed up and lightened by the punch, catching
  // the light from above. Shadows scale with the hole so a small one is not
  // swamped by its own blur.
  c.save();
  c.shadowColor = 'rgba(84,64,36,0.30)';
  c.shadowBlur = Math.min(3.5, h.r * 0.45);
  c.shadowOffsetY = 1.0;
  path(lipR);
  c.fillStyle = '#FBF7EA';
  c.fill();
  c.restore();

  // Brown ring — the bruised, dirtied edge of the tear.
  path(ringR);
  c.fillStyle = 'rgba(118,86,48,0.78)';
  c.fill();

  // The void, with a soft shadow bleeding onto the ring around it.
  c.save();
  c.shadowColor = 'rgba(16,11,4,0.75)';
  c.shadowBlur = Math.min(4, h.r * 0.5);
  c.shadowOffsetY = 1;
  path(h.r);
  c.fillStyle = C.void;
  c.fill();
  c.restore();
}

function buildPrintLayer(rs, sheet) {
  const w = PAPER.w + PRINT_MARGIN * 2;
  const { cv, c } = makeLayer(w, PAPER.h, rs);

  // Local coords: paper origin sits at (PRINT_MARGIN, 0).
  const ox = PRINT_MARGIN;

  // Blue rules. Perfectly straight, edge to edge — they do not bend around
  // the bump, because the bump is the pencil, not a lens.
  c.strokeStyle = C.rule;
  c.lineWidth = 1;
  c.globalAlpha = 0.72;
  for (let y = 58.5; y < PAPER.h - 24; y += 28) {
    c.beginPath();
    c.moveTo(0, y);
    c.lineTo(w, y);
    c.stroke();
  }

  // Red margin rule.
  c.strokeStyle = C.margin;
  c.globalAlpha = 0.55;
  c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(ox + 46.5, 0);
  c.lineTo(ox + 46.5, PAPER.h);
  c.stroke();
  c.globalAlpha = 1;

  // Start and finish markers, drawn under the holes like everything printed.
  c.save();
  c.setLineDash([5, 6]);
  c.strokeStyle = 'rgba(59,63,72,0.42)';
  c.lineWidth = 1.2;
  // Spanning the band rather than the sheet, so the dashes double as a hint
  // at where the tip may actually travel.
  const bandL = ox + (PLAY_LEFT - PAPER.x);
  const bandR = ox + (PLAY_RIGHT - PAPER.x);
  c.beginPath();
  c.moveTo(bandL, FINISH_Y - PAPER.y);
  c.lineTo(bandR, FINISH_Y - PAPER.y);
  c.stroke();
  c.beginPath();
  c.moveTo(bandL, HOLE_MAX_Y - PAPER.y);
  c.lineTo(bandR, HOLE_MAX_Y - PAPER.y);
  c.stroke();
  c.restore();

  c.fillStyle = 'rgba(59,63,72,0.5)';
  c.font = '11px "Courier Prime", monospace';
  c.textAlign = 'center';
  c.fillText('FINISH', ox + PAPER.w / 2, FINISH_Y - PAPER.y - 9);
  c.fillText('START',  ox + PAPER.w / 2, HOLE_MAX_Y - PAPER.y + 20);

  // Holes last: static holes are punched onto printLayer; moving holes are drawn live in render()
  c.save();
  c.translate(ox - PAPER.x, -PAPER.y);
  for (const h of sheet.holes) {
    if (!h.amp) drawHole(c, h);
  }
  c.restore();

  return { cv, c };
}

function rebuildLayers() {
  if (!game.sheet) return;
  const rs = Math.min(3, dpr * view.scale);
  paperLayer = buildPaperLayer(rs, game.sheet.seed);
  printLayer = buildPrintLayer(rs, game.sheet);
  layerScale = rs;
}

/* ═══════════════════════════════════════════════════════════════════════
   VIEW — virtual field -> device pixels
   ═══════════════════════════════════════════════════════════════════════ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let dpr = 1;
const view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0 };

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  dpr = Math.min(3, window.devicePixelRatio || 1);

  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';

  view.w = w; view.h = h;
  view.scale = Math.min(w / V.W, h / V.H);
  view.ox = (w - V.W * view.scale) / 2;
  view.oy = (h - V.H * view.scale) / 2;

  rebuildLayers();
  layoutStrips();
}

/** Screen (CSS px) -> virtual field coordinates. */
function toVirtual(clientX, clientY) {
  return {
    x: (clientX - view.ox) / view.scale,
    y: (clientY - view.oy) / view.scale,
  };
}

/* ═══════════════════════════════════════════════════════════════════════
   GAME STATE
   ═══════════════════════════════════════════════════════════════════════ */

const game = {
  state: 'title',        // title | ready | playing | fell | cleared | won
  mode: '1p',            // 1p | 2p
  runSeed: 0,
  level: 1,
  sheet: null,
  tip: { x: START_X, y: START_Y },
  target: { x: START_X, y: START_Y },   // where input wants the tip; the frame
                                        // loop is what actually moves it
  dragging: false,
  pointerId: null,
  grabDX: 0, grabDY: 0,
  elapsed: 0,
  best: 0,               // furthest fraction of the sheet crossed this attempt
  keys: { left: false, right: false, up: false, down: false },
  shake: 0,              // screen shake on falling in, ms remaining

  // --- Two-player ---
  surface: { x: 0, v: 0 },   // sideways offset of the printed sheet, and its
                             // velocity. The tip never moves with it.
  charges: 0,
  rechargeT: 0,
  round: 1,
  results: [],           // one { crossed, progress, time } per round
};

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function progressOf(y) {
  const span = START_Y - FINISH_Y;
  return Math.max(0, Math.min(1, (START_Y - y) / span));
}

function startRun() {
  game.mode = '1p';
  game.runSeed = (Math.random() * 0xFFFFFFFF) >>> 0;
  game.level = 1;
  loadSheet();
}

function loadSheet() {
  game.sheet = generateSheet(game.level, sheetSeed(game.runSeed, game.level));
  rebuildLayers();
  startRound();
}

/** Reset everything about an attempt without touching the sheet itself. */
function startRound() {
  const sx = startXFor(net.role);
  game.tip.x = sx;
  game.tip.y = START_Y;
  game.target.x = sx;
  game.target.y = START_Y;
  game.dragging = false;
  game.pointerId = null;
  game.elapsed = 0;
  game.best = 0;
  game.surface.x = 0;
  game.surface.v = 0;
  game.charges = T.SHAKE_CHARGES;
  game.rechargeT = 0;
  game.globalRank = null;
  game.state = 'ready';
  const px = startXFor(otherRole(net.role));
  net.peerTip.x = px;   net.peerTip.y = START_Y;
  net.peerShown.x = px; net.peerShown.y = START_Y;
  updateHud();
  updatePips();
  setStripsVisible(amHolder());
  showScreen(null);
}

/**
 * Two players, one device. The sheet is generated ONCE and both rounds run it,
 * so the comparison at the end is between two attempts at the same problem.
 */
function startDuel() {
  game.mode = '2p';
  game.runSeed = (Math.random() * 0xFFFFFFFF) >>> 0;
  game.level = T.TWO_P_LEVEL;
  game.sheet = generateSheet(game.level, sheetSeed(game.runSeed, game.level));
  rebuildLayers();
  game.round = 1;
  game.results = [];
  showScreen('roundready');
}

/**
 * Two devices, one race. Both players get a pencil on the same sheet and drag
 * at the same time — nobody is holding, so there is no shaking here.
 *
 * Each device judges only its OWN pencil. The peer's bump is drawn from the
 * positions they broadcast and is never collided against; their fall is their
 * device's verdict to report, not ours. The seed arrives from the server; the
 * sheet itself never crosses the wire.
 */
function startRace(seed) {
  game.mode = 'net';
  net.pencil = true;
  game.runSeed = seed >>> 0;
  game.level = T.TWO_P_LEVEL;
  game.sheet = generateSheet(game.level, sheetSeed(game.runSeed, game.level));
  rebuildLayers();
  game.round = 1;
  game.results = [];
  net.peerDone = null;
  net.myDone = null;
  const px = startXFor(otherRole(net.role));
  net.peerTip.x = px;   net.peerTip.y = START_Y;
  net.peerShown.x = px; net.peerShown.y = START_Y;
  showScreen('lobby');
}

/** Whose device is judging collisions. In a race, everyone judges their own. */
function amPencil() {
  return game.mode !== 'net' || net.pencil;
}

function updateHud() {
  if (game.mode === 'net') {
    // A race shows both climbs, so you can see how close it is without having
    // to read the other bump's height off the paper. Colour-coded to match the
    // pencil tips, so there is no guessing which figure is whose.
    const mine = Math.round((net.myDone ? net.myDone.progress : game.best) * 100);
    const theirs = Math.round((net.peerDone ? net.peerDone.progress
                                            : progressOf(net.peerTip.y)) * 100);
    const me = inkFor(net.role), them = inkFor(otherRole(net.role));
    // esc() is not optional here: peerLabel() is text the other phone chose.
    hudSheet.innerHTML =
      `<b style="color:${me.ui}">${esc(myLabel())} ${mine}%${net.myDone && !net.myDone.crossed ? ' OUT' : ''}</b>` +
      ` · <b style="color:${them.ui}">${esc(peerLabel())} ${theirs}%${net.peerDone && !net.peerDone.crossed ? ' OUT' : ''}</b>`;
  } else if (game.mode === '2p') {
    hudSheet.textContent = `ROUND ${game.round} / 2 · PLAYER ${game.round}'s TURN`;
  } else {
    hudSheet.textContent = `LEVEL ${game.level} / ${T.LEVELS}`;
  }
  hudTime.textContent = fmt(game.elapsed);
}

/* ── The printed surface ────────────────────────────────────────────────
   A shake is an impulse to the surface velocity; a damped spring drags it
   back to zero. The pencil hand is steady, so the tip does not move with it
   — which is exactly why collision has to be measured relative to the sheet.
   ─────────────────────────────────────────────────────────────────────── */

function stepSurface(dtMs) {
  const s = game.surface;
  if (s.x === 0 && s.v === 0) return;

  // Sub-stepped: at stiffness 190 a single 50ms step would diverge.
  let remaining = dtMs / 1000;
  const H = 1 / 240;
  while (remaining > 0) {
    const h = Math.min(H, remaining);
    s.v += (-T.SHAKE_STIFFNESS * s.x - T.SHAKE_DAMPING * s.v) * h;
    s.x += s.v * h;
    remaining -= h;
  }
  if (Math.abs(s.x) < 0.02 && Math.abs(s.v) < 0.02) { s.x = 0; s.v = 0; }
}

/**
 * Kick the sheet. Runs on BOTH devices — the holder calls it the instant they
 * tap, without waiting for the round trip, and the pencil calls it when the
 * message lands. The two springs are integrated independently from the same
 * impulse, so they drift by the one-way latency and then both settle to zero.
 * That drift is cosmetic: only the pencil's device judges collisions.
 */
function applyShake(dir) {
  game.surface.v += dir * T.SHAKE_IMPULSE;

  // Checked immediately, not deferred to the next frame: the holder must be
  // able to catch a stationary pencil that is already sitting on an edge.
  if (amPencil() && game.state === 'playing' &&
      tipInHole(game.tip.x - game.surface.x, game.tip.y)) onFell();
}

/**
 * The holder's move, on a shared device only. dir: -1 shoves the sheet left,
 * +1 right. Two phones play a race, where both players hold a pencil and
 * nobody is holding the sheet — so no shake ever crosses the wire.
 */
function shakeSheet(dir) {
  if (!amHolder()) return false;
  if (game.state !== 'ready' && game.state !== 'playing') return false;
  if (game.charges < 1) return false;

  if (game.state === 'ready') game.state = 'playing';

  game.charges--;
  game.rechargeT = 0;
  updatePips();
  soundShake();
  applyShake(dir);
  return true;
}

/** Am I holding the sheet? Only ever true on a shared device. */
function amHolder() { return game.mode === '2p'; }

function isDuel() { return game.mode === '2p' || game.mode === 'net'; }

/* ═══════════════════════════════════════════════════════════════════════
   COLLISION
   The tip is a single point. We walk the segment between the previous and
   current position in small steps so that a fast flick cannot tunnel across a
   hole, and we take whichever happens first along that path: reaching the
   finish, or dropping through.
   ═══════════════════════════════════════════════════════════════════════ */

/** Calculate live X position for oscillating holes on Level 9+ */
function getHoleX(h, timeSec) {
  if (!h || !h.amp) return h ? h.x : 0;
  const t = timeSec != null ? timeSec : (performance.now() * 0.001);
  return Math.max(PLAY_LEFT + h.r + 4, Math.min(PLAY_RIGHT - h.r - 4, h.baseX + Math.sin(t * h.freq + h.phase) * h.amp));
}

function tipInHole(x, y) {
  const holes = game.sheet.holes;
  const timeSec = performance.now() * 0.001;
  for (let i = 0; i < holes.length; i++) {
    const h = holes[i];
    const rr = h.r - T.HOLE_FORGIVENESS;
    if (rr <= 0) continue;
    const hx = getHoleX(h, timeSec);
    const dx = x - hx, dy = y - h.y;
    if (dx * dx + dy * dy < rr * rr) return true;
  }
  return false;
}

/**
 * Calculate net gravitational pull (suction) offset for position (x, y)
 * at the given level difficulty. Active on Level 2+.
 */
function getHoleSuctionOffset(x, y, level) {
  if (!level || level < 2 || !game.sheet || !game.sheet.holes) return { dx: 0, dy: 0 };

  const levelFactor = Math.min(1, level / 12);
  const pullDist = 18 + levelFactor * 36;
  const maxStrength = 1.2 + levelFactor * 3.8;
  const timeSec = performance.now() * 0.001;

  let netDx = 0, netDy = 0;
  const holes = game.sheet.holes;
  for (let i = 0; i < holes.length; i++) {
    const h = holes[i];
    const hx = getHoleX(h, timeSec);
    const dx = hx - x;
    const dy = h.y - y;
    const dist = Math.hypot(dx, dy);
    const maxRange = h.r + pullDist;

    if (dist > 0.5 && dist < maxRange) {
      const factor = 1 - Math.max(0, dist - h.r) / pullDist;
      const pull = Math.pow(factor, 1.4) * maxStrength;
      netDx += (dx / dist) * pull;
      netDy += (dy / dist) * pull;
    }
  }
  return { dx: netDx, dy: netDy };
}

/** Clamp a position to the punched band. */
function clampX(x) { return Math.max(PLAY_LEFT, Math.min(PLAY_RIGHT, x)); }
function clampY(y) { return Math.max(PAPER.y + 2, Math.min(PAPER.y + PAPER.h - 2, y)); }

function setTarget(x, y) {
  game.target.x = clampX(x);
  game.target.y = clampY(y);
}

/**
 * Advance the tip to (tx, ty) while the printed surface slides from surfFrom
 * to surfTo, sweeping the path. Returns 'ok' | 'fell' | 'finish'.
 *
 * The sweep is measured in SURFACE space — the tip's path relative to the
 * sheet — because both can be moving. Sweeping the two motions separately
 * would trace an L rather than the true diagonal, and could step over a hole
 * that the diagonal passes straight through.
 */
function advanceTip(tx, ty, surfFrom, surfTo) {
  tx = clampX(tx);
  ty = clampY(ty);

  const x0 = game.tip.x, y0 = game.tip.y;
  const dx = tx - x0, dy = ty - y0;

  // Relative displacement decides the sampling density, so a shake that whips
  // the paper past a motionless tip is sampled just as finely as a flick.
  const rx0 = x0 - surfFrom, rx1 = tx - surfTo;
  const dist = Math.hypot(rx1 - rx0, dy);
  const steps = Math.max(1, Math.ceil(dist / T.COLLISION_STEP));

  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const y = y0 + dy * t;

    if (y <= FINISH_Y) {
      game.tip.x = x0 + dx * t; game.tip.y = FINISH_Y;
      game.best = 1;
      onFinish();
      return 'finish';
    }
    if (tipInHole(rx0 + (rx1 - rx0) * t, y)) {
      game.tip.x = x0 + dx * t; game.tip.y = y;
      onFell();
      return 'fell';
    }
    game.best = Math.max(game.best, progressOf(y));
  }

  game.tip.x = tx;
  game.tip.y = ty;
  return 'ok';
}

/** Move against the surface where it currently sits. */
function moveTip(tx, ty) {
  return advanceTip(tx, ty, game.surface.x, game.surface.x);
}

function onFell() {
  game.state = 'fell';
  game.dragging = false;
  game.pointerId = null;
  soundDrop();
  if (!reduceMotion) game.shake = T.SHAKE_MS;
  if (game.mode === '1p') recordLevelResult(game.level, game.elapsed, false);
  if (isDuel()) return endRound(false);
  showScreen('fell');
}

function onFinish() {
  game.dragging = false;
  game.pointerId = null;
  game.state = 'cleared';
  soundVictory();
  if (game.mode === '1p') {
    const prev = stats.sp.levels[String(game.level)];
    game.isNewBest = !prev || prev.best === null || game.elapsed < prev.best;
    game.earnedStars = getStars(game.level, game.elapsed);
    recordLevelResult(game.level, game.elapsed, true);
    submitGlobalScore(game.level, game.elapsed).then(() => {
      const badge = document.getElementById('rank-badge-text');
      if (badge && game.globalRank) {
        badge.textContent = `🌍 Rank #${game.globalRank} worldwide!`;
      }
    });
  }
  if (isDuel()) return endRound(true);
  if (game.level >= T.LEVELS) {
    game.state = 'won';
    showScreen('won');
    triggerVictoryFireworks(6);
  } else {
    showScreen('cleared');
    triggerVictoryFireworks(3);
  }
}

function endRound(crossed) {
  if (game.mode === 'net') return raceDone(crossed);
  game.results.push({ crossed, progress: game.best, time: game.elapsed });
  setStripsVisible(false);
  if (game.round === 2) {
    const [a, b] = game.results;
    const win = judgeDuel(a, b);
    if ((win === 1 && a.crossed) || (win === 2 && b.crossed)) {
      triggerVictoryFireworks(4);
    }
    recordDuel(win === 1 ? 'p1' : win === 2 ? 'p2' : 'draw');
  }
  showScreen(game.round === 1 ? 'roundover' : 'duelover');
}

/* ── Finishing a race ───────────────────────────────────────────────────
   Two independent runs that happen to overlap in time. Whoever finishes
   first waits and watches the other, because falling in early does not end
   their run — the result is only decided once both are in.
   ─────────────────────────────────────────────────────────────────────── */

function raceDone(crossed) {
  if (net.myDone) return;                       // already reported
  net.myDone = { crossed, progress: game.best, time: game.elapsed };
  netSend({ k: 'done', ...net.myDone });
  settleRace();
}

/** They reported their own outcome; it is theirs to decide, not ours. */
function peerDone(r) {
  if (net.peerDone) return;
  net.peerDone = {
    crossed: !!r.crossed,
    progress: readCoord(r.progress, 0, 1, 0),
    time: readCoord(r.time, 0, 24 * 60 * 60 * 1000, 0),
  };
  settleRace();
}

function settleRace() {
  if (!net.myDone) return;                      // still climbing

  // Instant victory: If I crossed the finish line, I won the race!
  // No need to wait for peer if I crossed first.
  if (net.myDone.crossed) {
    game.state = 'raceover';
    game.dragging = false;
    game.pointerId = null;
    const peerRes = net.peerDone || { crossed: false, progress: progressOf(net.peerTip.y), time: game.elapsed };
    game.results = [net.myDone, peerRes];
    recordRace(true);
    triggerVictoryFireworks(5);
    showScreen('raceover');
    return;
  }

  // If I fell and peer is still going, watch until they finish or fall.
  if (!net.peerDone) {
    game.state = 'watching';
    game.dragging = false;
    game.pointerId = null;
    updateHud();
    showScreen(null);
    return;
  }

  // Both runs complete:
  game.state = 'raceover';
  game.results = [net.myDone, net.peerDone];
  const win = judgeDuel(net.myDone, net.peerDone);
  recordRace(win === 1);

  // Trigger fireworks ONLY if the winner actually crossed the finish line!
  if ((win === 1 && net.myDone.crossed) || (win === 2 && net.peerDone.crossed)) {
    triggerVictoryFireworks(5);
  }

  showScreen('raceover');
}

/**
 * Crossing beats not crossing; then furthest progress; then fastest time.
 * Returns 1, 2, or 0 for a dead heat.
 */
function judgeDuel(a, b) {
  if (a.crossed !== b.crossed) return a.crossed ? 1 : 2;
  if (Math.abs(a.progress - b.progress) > 1e-4) return a.progress > b.progress ? 1 : 2;
  if (Math.abs(a.time - b.time) > 1) return a.time < b.time ? 1 : 2;
  return 0;
}

/* ═══════════════════════════════════════════════════════════════════════
   NETWORK — two phones, one relay
   The server never sees a hole. Both devices generate the same sheet from the
   one seed it hands out, the pencil's device is the only authority on
   collisions, and everything below is a thin transport around that.
   ═══════════════════════════════════════════════════════════════════════ */

const net = {
  ws: null,
  code: null,
  role: null,          // 'host' | 'guest'
  pencil: true,        // in a race both players hold a pencil, always
  seed: 0,
  myName: getPlayerName(),     // auto-populated from saved player name
  peerName: '',        // typed on THEIR phone, so treated as hostile input
  peerTip:   { x: START_X, y: START_Y },   // last position they reported
  peerShown: { x: START_X, y: START_Y },   // eased, so 20 packets/sec is smooth
  peerDone: null,      // { crossed, progress, time } once they finish
  myDone: null,
  countdown: 0,
  lastSent: 0,
  status: '',
};

/** Online play needs the page served over http; file:// has no server. */
const canGoOnline = location.protocol === 'http:' || location.protocol === 'https:';

function netSend(d) {
  if (net.ws && net.ws.readyState === WebSocket.OPEN) {
    net.ws.send(JSON.stringify({ t: 'msg', d }));
  }
}

function netConnect(then) {
  if (net.ws) {
    if (net.ws.readyState === WebSocket.OPEN) { then(); return; }
    if (net.ws.readyState === WebSocket.CONNECTING) {
      // A second tap while the first is still dialling: queue behind it rather
      // than opening a socket the server would count as another player.
      const prev = net.ws.onopen;
      net.ws.onopen = (e) => { if (prev) prev(e); then(); };
      return;
    }
    closeSocket();
  }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  net.ws = ws;

  ws.onopen = () => then();
  ws.onerror = () => { net.status = 'Can\'t connect to the server.'; showScreen('netfail'); };
  ws.onclose = () => {
    net.ws = null;
    if (game.mode === 'net') {
      net.status = 'Connection lost.';
      game.mode = '1p';
      setStripsVisible(false);
      showScreen('netfail');
    }
  };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    handleServer(m);
  };
}

function handleServer(m) {
  switch (m.t) {
    case 'room':
      // Shape-check what the server hands back rather than trusting it.
      net.code = /^\d{4}$/.test(String(m.code)) ? String(m.code) : null;
      net.role = 'host';
      showScreen('hosting');
      break;

    case 'ready':
      net.role = m.role;
      net.seed = m.seed >>> 0;
      startRace(net.seed);
      // Both sides fire this on pairing, so each learns the other's name.
      netSend({ k: 'name', name: net.myName });
      break;

    case 'seed':
      // A fresh sheet for both phones at once.
      net.seed = m.seed >>> 0;
      startRace(net.seed);
      break;

    case 'err':
      net.status = String(m.m || 'Something went wrong.').slice(0, 120);
      showScreen('netfail');
      break;

    case 'gone':
      net.status = 'The other player left.';
      game.mode = '1p';
      game.state = 'title';
      setStripsVisible(false);
      showScreen('netfail');
      break;

    case 'msg':
      handlePeer(m.d || {});
      break;
  }
}

/**
 * Everything arriving from the other phone is untrusted. The relay forwards
 * whatever it is handed, so a modified client can send anything at all — and
 * a single non-finite coordinate reaching a canvas gradient throws, which used
 * to take the whole render loop down with it.
 */
function readCoord(v, lo, hi, fallback) {
  const n = typeof v === 'number' ? v : Number(v);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(lo, Math.min(hi, n));
}

/**
 * A name is free text from the other phone that ends up inside a card and the
 * HUD, both of which are built as HTML. Strip control characters, cap the
 * length so it cannot blow out the layout, and rely on esc() at every render —
 * belt and braces, because this is the one string a stranger fully controls.
 */
function cleanName(s) {
  return String(s == null ? '' : s)
    .replace(/[\u0000-\u001F\u007F-\u009F\u200B-\u200F\u2028\u2029]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, T.MAX_NAME);
}

/** Falls back to the pencil colour, which is a fine name on its own. */
function myLabel()   { return net.myName   || inkFor(net.role).name; }
function peerLabel() { return net.peerName || inkFor(otherRole(net.role)).name; }

function handlePeer(d) {
  if (!d || typeof d.k !== 'string') return;

  switch (d.k) {
    case 'begin':
      // The host starts it, so there is no readiness handshake to get wrong.
      startCountdown();
      break;

    case 'name':
      net.peerName = cleanName(d.name);
      if (game.mode === 'net') updateHud();
      if (!screens.hidden) showScreen(currentScreen);   // repaint the open card
      break;

    case 'tip':
      net.peerTip.x = readCoord(d.x, PLAY_LEFT, PLAY_RIGHT, net.peerTip.x);
      net.peerTip.y = readCoord(d.y, PAPER.y, PAPER.y + PAPER.h, net.peerTip.y);
      break;

    case 'done':
      peerDone(d);
      break;
  }
}

/** Host only: put both phones on the same countdown. */
function beginRace() {
  netSend({ k: 'begin' });
  startCountdown();
}

/**
 * Both phones count down locally before anyone can move. The two clocks start
 * one network hop apart rather than one tap apart, which on a LAN is a couple
 * of milliseconds against a 2.6 second lead-in.
 */
function startCountdown() {
  net.peerDone = null;
  net.myDone = null;
  startRound();                  // seeds both start positions from the roles
  net.countdown = T.RACE_COUNTDOWN_MS;
  game.state = 'countdown';
  showScreen(null);
}

/* ═══════════════════════════════════════════════════════════════════════
   INPUT
   ═══════════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════════
   INPUT — Multi-touch safe for 2P Same Phone mode
   ═══════════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════════
   INPUT — Global Multi-touch safe for 2P Same Phone mode
   ═══════════════════════════════════════════════════════════════════════ */

let activePencilTouchId = null;

function startPencilDrag(clientX, clientY, id) {
  if (game.state !== 'ready' && game.state !== 'playing') return;
  if (!amPencil()) return;             // the holder does not get to drag
  const p = toVirtual(clientX, clientY);

  let dx = game.tip.x - p.x;
  let dy = game.tip.y - p.y;
  const minAbove = T.MIN_ABOVE_FINGER / view.scale;
  if (dy > -minAbove) dy = -minAbove;

  game.grabDX = dx;
  game.grabDY = dy;
  game.dragging = true;
  game.pointerId = id;
  game.state = 'playing';

  setTarget(p.x + dx, p.y + dy);
}

function movePencilDrag(clientX, clientY, id) {
  if (!game.dragging) return;
  if (game.pointerId !== null && id !== game.pointerId) return;
  const p = toVirtual(clientX, clientY);
  setTarget(p.x + game.grabDX, p.y + game.grabDY);
}

function endPencilDrag(id) {
  if (game.pointerId === id) {
    game.dragging = false;
    game.pointerId = null;
  }
}

// 1. Global Touch Engine for Mobile Devices (Pencil Drag + Side Shake Strips)
const touchedShakes = new Set();

function handleMobileTouches(e) {
  if (game.state !== 'ready' && game.state !== 'playing') return;

  const hitL = Math.max(64, view.ox + T.SHAKE_STRIP * view.scale + 10);
  const hitR = window.innerWidth - hitL;

  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    const x = t.clientX;

    // Check if this touch is on the left/right shake buttons in 2P mode
    if (game.mode === '2p') {
      if (x <= hitL && t.identifier !== activePencilTouchId) {
        if (!touchedShakes.has(t.identifier)) {
          touchedShakes.add(t.identifier);
          pressStrip(stripL, -1);
        }
        continue;
      } else if (x >= hitR && t.identifier !== activePencilTouchId) {
        if (!touchedShakes.has(t.identifier)) {
          touchedShakes.add(t.identifier);
          pressStrip(stripR, +1);
        }
        continue;
      }
    }

    // Otherwise, this touch drives the pencil!
    if (amPencil()) {
      if (activePencilTouchId === null) {
        activePencilTouchId = t.identifier;
        startPencilDrag(t.clientX, t.clientY, t.identifier);
      } else if (t.identifier === activePencilTouchId) {
        movePencilDrag(t.clientX, t.clientY, t.identifier);
      }
    }
  }
}

window.addEventListener('touchstart', (e) => {
  if (game.state === 'ready' || game.state === 'playing') {
    handleMobileTouches(e);
  }
}, { passive: true });

window.addEventListener('touchmove', (e) => {
  if (game.state === 'ready' || game.state === 'playing') {
    handleMobileTouches(e);
  }
}, { passive: true });

window.addEventListener('touchend', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const id = e.changedTouches[i].identifier;
    touchedShakes.delete(id);
    if (id === activePencilTouchId) {
      endPencilDrag(id);
      activePencilTouchId = null;
    }
  }
}, { passive: true });

window.addEventListener('touchcancel', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const id = e.changedTouches[i].identifier;
    touchedShakes.delete(id);
    if (id === activePencilTouchId) {
      endPencilDrag(id);
      activePencilTouchId = null;
    }
  }
}, { passive: true });

// 2. Desktop Mouse & Pointer Events
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return; // Handled by mobile touch listeners
  startPencilDrag(e.clientX, e.clientY, e.pointerId);
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  movePencilDrag(e.clientX, e.clientY, e.pointerId);
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('pointerup', (e) => {
  if (e.pointerType === 'touch') return;
  endPencilDrag(e.pointerId);
});

canvas.addEventListener('pointercancel', (e) => {
  if (e.pointerType === 'touch') return;
  endPencilDrag(e.pointerId);
});

const KEY_MAP = {
  ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  a: 'left', d: 'right', w: 'up', s: 'down',
};

window.addEventListener('keydown', (e) => {
  // Alternate keys for the holder, so two people can share a keyboard.
  if (amHolder() && (e.key === 'z' || e.key === 'Z')) { pressStrip(stripL, -1); return; }
  if (amHolder() && (e.key === 'm' || e.key === 'M')) { pressStrip(stripR, +1); return; }

  const k = KEY_MAP[e.key];
  if (!k) return;
  if (game.state !== 'ready' && game.state !== 'playing') return;
  game.keys[k] = true;
  game.state = 'playing';
  e.preventDefault();
});

window.addEventListener('keyup', (e) => {
  const k = KEY_MAP[e.key];
  if (k) game.keys[k] = false;
});

/* ── Shake strips ──────────────────────────────────────────────────────
   Real buttons, so they are focusable and announce themselves. They are DOM
   rather than canvas because they are UI pinned to the screen, not part of
   the sheet — and because a 56px thumb target should not have to be
   hit-tested by hand.
   ─────────────────────────────────────────────────────────────────────── */

const stripsEl = document.getElementById('strips');
const stripL = document.getElementById('strip-l');
const stripR = document.getElementById('strip-r');
const pipsL = document.getElementById('pips-l');
const pipsR = document.getElementById('pips-r');

for (const box of [pipsL, pipsR]) {
  for (let i = 0; i < T.SHAKE_CHARGES; i++) {
    const d = document.createElement('span');
    d.className = 'pip';
    box.appendChild(d);
  }
}

function updatePips() {
  for (const box of [pipsL, pipsR]) {
    const kids = box.children;
    for (let i = 0; i < kids.length; i++) kids[i].classList.toggle('on', i < game.charges);
  }
  const empty = game.charges < 1;
  stripL.classList.toggle('empty', empty);
  stripR.classList.toggle('empty', empty);
}

function pressStrip(el, dir) {
  if (!shakeSheet(dir)) return;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 110);
}

for (const [el, dir] of [[stripL, -1], [stripR, +1]]) {
  el.addEventListener('touchstart', (e) => { pressStrip(el, dir); e.preventDefault(); }, { passive: false });
  el.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') return;
    pressStrip(el, dir);
    e.preventDefault();
  }, { passive: false });
  // Keyboard activation of the focused button, without double-firing on tap.
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { pressStrip(el, dir); e.preventDefault(); }
  });
}

function setStripsVisible(on) {
  stripsEl.hidden = !on;
  if (on) layoutStrips();
}

/** Strips span from the screen edge to the inner edge of the un-punched
 *  margin, so they line up with the paper however the field is letterboxed. */
function layoutStrips() {
  const hit  = view.ox + T.SHAKE_STRIP * view.scale;
  const band = view.ox + (T.SHAKE_STRIP - T.BUMP_RADIUS) * view.scale;
  for (const el of [stripL, stripR]) {
    el.style.width = hit + 'px';
    el.style.setProperty('--band', band + 'px');
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   SCREENS
   ═══════════════════════════════════════════════════════════════════════ */

const screens = document.getElementById('screens');
const card = document.getElementById('card');
const hud = document.getElementById('hud');
const hudSheet = document.getElementById('hud-sheet');
const hudTime = document.getElementById('hud-time');

function fmt(t) { return (t / 1000).toFixed(1); }

/**
 * Cards are assembled as HTML strings, so anything that did not come from this
 * file has to be escaped on the way in. The room code and the status line both
 * originate at the server, and a server is exactly the thing you should not
 * assume is friendly just because you started it.
 */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** Which card is up, so a late-arriving name can repaint it in place. */
let currentScreen = null;

function showScreen(kind) {
  currentScreen = kind || null;

    screens.hidden = true;
    hud.classList.remove('hidden');
    return;

  hud.classList.add('hidden');

  const pct = Math.round(game.best * 100);
  let html = '';

  if (kind === 'title') {
    html = `
      <h1 id="card-title">Don't<br>Fall In</h1>

             autocomplete="off" autocapitalize="words" spellcheck="false"
             placeholder="Your name (for Leaderboard)" aria-label="Your name"
             value="${esc(getPlayerName() || net.myName)}">
      <div class="rule"></div>
      <button id="btn-primary">One player</button>
      <button id="btn-secondary" class="ghost">Two players, one phone</button>
      <button id="btn-third" class="ghost"${canGoOnline ? '' : ' disabled'}>Two phones</button>
      <div style="display:flex;gap:6px;margin-top:10px;">
        <button id="btn-stats" class="ghost" style="flex:1;margin-top:0">📊 Scoreboard</button>
        <button id="btn-skins" class="ghost" style="flex:1;margin-top:0">🎨 Skins</button>
      </div>
      <p class="hint">${canGoOnline
        ? 'Tap and drag the bump. You can also use arrow keys.'
        : 'To play on two phones, run <strong>node server.js</strong> on your computer and open the link it shows.'}</p>`;

  } else if (kind === 'netmenu') {
    html = `
      <h2 id="card-title">Two phones</h2>
      <p>Race! Both players get a pencil on the same sheet.</p>
      <input class="code-in name-in" id="name-in" maxlength="${T.MAX_NAME}"
             autocomplete="off" autocapitalize="words" spellcheck="false"
             placeholder="Your name" aria-label="Your name"
             value="${esc(net.myName)}">
      <p class="hint" style="margin-top:6px">Optional. If you skip this,
         your pencil color is your name.</p>
      <div class="rule"></div>
      <button id="btn-primary">Host a room</button>
      <button id="btn-secondary" class="ghost">Join with a code</button>
      <button id="btn-third" class="ghost">← Back</button>`;

  } else if (kind === 'hosting') {
    html = `
      <h2 id="card-title">Your room code</h2>
      <p class="code">${esc(net.code) || '····'}</p>
      <p>Tell this code to the other player. They tap <strong>Join with a code</strong>
         and type it in.</p>
      <p class="waiting">Waiting for the other player…</p>
      <button id="btn-secondary" class="ghost">← Back</button>`;

  } else if (kind === 'joining') {
    html = `
      <h2 id="card-title">Enter room code</h2>
      <p>Type the 4-digit code from the other player's phone.</p>
      <input class="code-in" id="code-in" inputmode="numeric" pattern="[0-9]*"
             maxlength="4" autocomplete="off" aria-label="Four digit room code">
      <input class="code-in name-in" id="name-in" maxlength="${T.MAX_NAME}"
             autocomplete="off" autocapitalize="words" spellcheck="false"
             placeholder="Your name" aria-label="Your name"
             value="${esc(net.myName)}">
      <p class="hint" style="margin-top:6px">Optional. If you skip this,
         your pencil color is your name.</p>
      <button id="btn-primary">Join</button>
      <button id="btn-secondary" class="ghost">← Back</button>`;

  } else if (kind === 'netfail') {
    html = `
      <h2 id="card-title">${esc(net.status) || 'Disconnected.'}</h2>
      <p>Make sure both phones are on the same Wi-Fi and the server
         is still running.</p>
      <button id="btn-primary">Main Menu</button>`;

  } else if (kind === 'lobby') {
    const me = inkFor(net.role), them = inkFor(otherRole(net.role));
    const side = net.role === 'host' ? 'left' : 'right';
    html = `
      <h2 id="card-title">Race!</h2>

      <div class="rule"></div>
