<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#191B21"/>
  <!-- Paper sheet -->
  <rect x="10" y="10" width="44" height="44" rx="4" fill="#EDE6D3"/>
  <!-- Grid rule lines -->
  <line x1="10" y1="24" x2="54" y2="24" stroke="#A8BCCB" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="38" x2="54" y2="38" stroke="#A8BCCB" stroke-width="1" opacity="0.6"/>
  <!-- Margin line -->
  <line x1="20" y1="10" x2="20" y2="54" stroke="#C0554C" stroke-width="1" opacity="0.6"/>
  <!-- Hole -->
  <circle cx="40" cy="24" r="5" fill="#0B0C0F"/>
  <circle cx="40" cy="24" r="6" stroke="#765630" stroke-width="0.8" fill="none"/>
  <!-- Pencil bump -->
  <circle cx="30" cy="38" r="7" fill="rgba(96,72,42,0.2)"/>
  <circle cx="28" cy="36" r="6" fill="#FFFDF6" opacity="0.6"/>
  <circle cx="29" cy="37" r="2" fill="#3B3F48"/>
</svg>
